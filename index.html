<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NetForge | Менеджер Сетевых Команд</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    
    <!-- PWA манифест -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2563eb">
    <meta name="description" content="Локальная база знаний CLI-команд для сетевых инженеров">
    
    <!-- iOS PWA поддержка -->
    <!-- <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="NetForge">
    <link rel="apple-touch-icon" href="icons/icon-192.svg"> -->
    
    <!-- Фавикон -->
    <link rel="icon" type="image/svg+xml" href="favicon.svg">

</head>
<body class="h-screen flex flex-col overflow-hidden">

    <!-- Header -->
    <header class="h-16 glass flex items-center justify-between px-4 sm:px-6 z-20 border-b border-slate-700 shrink-0">
        <!-- Левая часть: Бургер + Логотип -->
        <div class="flex items-center gap-2 sm:gap-3">
            <!-- Кнопка бургер-меню (только на мобильных) -->
            <button id="btn-menu" class="md:hidden p-2 text-slate-400 hover:text-white rounded-lg hover:bg-slate-700/50 transition-colors">
                <i class="fa-solid fa-bars text-lg"></i>
            </button>
            <div class="w-8 h-8 bg-blue-600 rounded-lg flex items-center justify-center shadow-lg shadow-blue-500/30">
                <i class="fa-solid fa-network-wired text-white text-sm"></i>
            </div>
            <h1 class="text-lg sm:text-xl font-bold tracking-tight">Net<span class="text-blue-500">Forge</span></h1>
        </div>
        
        <!-- Правая часть: Поиск + Кнопки -->
        <div class="flex items-center gap-2 sm:gap-4">
            <!-- Поиск: скрыт на мобильных -->
            <div class="relative hidden sm:block">
                <i class="fa-solid fa-search absolute left-3 top-1/2 transform -translate-y-1/2 text-slate-400 text-sm"></i>
                <input type="text" id="global-search" placeholder="Поиск команд..." 
                    class="bg-slate-800 border border-slate-700 text-sm rounded-full pl-9 pr-4 py-1.5 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 w-48 md:w-64 transition-all">
            </div>
            
            <!-- Кнопка "+": текст скрыт на мобильных -->
            <button id="btn-new-cmd" class="bg-blue-600 hover:bg-blue-500 text-white px-3 sm:px-4 py-1.5 rounded-full text-sm font-medium transition-colors flex items-center gap-2 shadow-lg shadow-blue-600/20">
                <i class="fa-solid fa-plus"></i> 
                <span class="hidden sm:inline">Новая команда</span>
            </button>
            
            <!-- Кнопка установки PWA -->
            <button id="btn-install-pwa" class="hidden bg-emerald-600 hover:bg-emerald-500 text-white px-2 sm:px-3 py-1.5 rounded-full text-sm font-medium transition-colors items-center gap-2">
                <i class="fa-solid fa-download"></i> 
                <span class="hidden md:inline">Установить</span>
            </button>
        </div>
    </header>

    <!-- Main Layout -->
    <div class="flex flex-1 min-h-0 relative">
        
        <!-- Оверлей для мобильного меню -->
        <div id="mobile-overlay" class="fixed inset-0 bg-black/50 z-30 hidden md:hidden" onclick="toggleMobileMenu()"></div>

        <!-- Sidebar -->
        <aside id="sidebar" class="
            w-72 md:w-64 bg-slate-900 border-r border-slate-800 flex flex-col 
            md:flex overflow-y-auto shrink-0
            fixed md:static inset-y-0 left-0 z-40
            transform -translate-x-full md:translate-x-0
            transition-transform duration-300 ease-in-out
        ">
            <!-- Кнопка закрытия для мобильного меню -->
            <div class="md:hidden flex justify-end p-2 border-b border-slate-800">
                <button onclick="toggleMobileMenu()" class="p-2 text-slate-400 hover:text-white">
                    <i class="fa-solid fa-times text-lg"></i>
                </button>
            </div>
            
            <!-- Поиск для мобильных (внутри сайдбара) -->
            <div class="sm:hidden p-4 border-b border-slate-800">
                <div class="relative">
                    <i class="fa-solid fa-search absolute left-3 top-1/2 transform -translate-y-1/2 text-slate-400 text-sm"></i>
                    <input type="text" id="global-search-mobile" placeholder="Поиск команд..." 
                        class="w-full bg-slate-800 border border-slate-700 text-sm rounded-full pl-9 pr-4 py-2 focus:outline-none focus:border-blue-500">
                </div>
            </div>

            <div class="p-4 shrink-0">
                <h3 class="text-xs font-bold text-slate-500 uppercase tracking-wider mb-4">Вендоры</h3>
                <div id="vendor-filters" class="space-y-1"></div>
            </div>
            
            <div class="p-4 border-t border-slate-800 shrink-0">
                <h3 class="text-xs font-bold text-slate-500 uppercase tracking-wider mb-4">Теги</h3>
                <div id="tag-cloud" class="flex flex-wrap gap-2"></div>
            </div>

            <!-- AutoBackup Section -->
            <div class="p-4 border-t border-slate-800 shrink-0">
                <h3 class="text-xs font-bold text-slate-500 uppercase tracking-wider mb-3">Автобэкап</h3>
                <div class="bg-slate-800/50 rounded-lg p-3 space-y-2">
                    <div class="flex items-center justify-between">
                        <span class="text-xs text-slate-400">Статус</span>
                        <div class="flex items-center gap-2">
                            <div id="backup-status-indicator" class="w-2 h-2 rounded-full bg-green-500"></div>
                            <span id="backup-status-text" class="text-xs text-slate-300">Активен</span>
                        </div>
                    </div>
                    <div class="flex items-center justify-between">
                        <span class="text-xs text-slate-400">Сохранение</span>
                        <span id="backup-destination-text" class="text-xs text-blue-400">В загрузки</span>
                    </div>
                    <div class="flex items-center justify-between">
                        <span class="text-xs text-slate-400">Последний</span>
                        <span id="backup-last-date" class="text-xs text-slate-300">-</span>
                    </div>
                    <div class="pt-2 border-t border-slate-700/50 flex gap-2">
                        <button id="btn-backup-now" class="flex-1 px-2 py-1.5 bg-blue-600/20 hover:bg-blue-600/30 text-blue-400 rounded text-xs transition-colors">
                            <i class="fa-solid fa-download mr-1"></i> Сейчас
                        </button>
                        <button id="btn-backup-toggle" class="px-2 py-1.5 bg-slate-700/50 hover:bg-slate-700 text-slate-400 rounded text-xs transition-colors" title="Вкл/Выкл">
                            <i class="fa-solid fa-power-off"></i>
                        </button>
                    </div>
                </div>
            </div>
            
            <!-- LOGGER -->
            <div class="p-4 border-t border-slate-800 shrink-0">
                <h3 class="text-xs font-bold text-slate-500 uppercase tracking-wider mb-3">Логи</h3>
                <div class="bg-slate-800/50 rounded-lg p-3 space-y-2">
                    <div class="flex items-center justify-between">
                        <span class="text-xs text-slate-400">Запись в папку</span>
                        <span id="log-status-text" class="text-xs text-slate-400">Выключена</span>
                    </div>
                    <button id="btn-toggle-logs" class="w-full px-2 py-1.5 bg-blue-600/20 hover:bg-blue-600/30 text-blue-400 rounded text-xs transition-colors">
                        <i class="fa-solid fa-folder mr-1"></i> Включить
                    </button>
                </div>
            </div>

            <div class="mt-auto p-4 border-t border-slate-800 shrink-0">
                <div class="bg-slate-800/50 rounded-lg p-3">
                    <div class="flex items-center gap-2 mb-2">
                        <div class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></div>
                        <span class="text-xs text-slate-300">Локальное хранилище</span>
                    </div>
                    <div class="text-xs text-slate-500">База: <span id="db-count">0</span> записей</div>
                    <button id="btn-clear-all" class="mt-2 text-xs text-red-400 hover:text-red-300 underline">Очистить всё</button>
                </div>
            </div>
        </aside>

        <!-- Content Area -->
        <main class="flex-1 flex flex-col min-h-0 bg-slate-900/50">
            <!-- Toolbar -->
            <div class="h-12 border-b border-slate-800 flex items-center justify-between px-4 sm:px-6 bg-slate-900/80 backdrop-blur shrink-0">
                <div class="flex items-center gap-2 text-sm text-slate-400">
                    <span id="result-count">0</span> <span class="hidden sm:inline">команд найдено</span>
                </div>
                <div class="flex items-center gap-2">
                    <button id="btn-export" class="p-2 text-slate-400 hover:text-white transition-colors" title="Экспорт JSON">
                        <i class="fa-solid fa-file-export"></i>
                    </button>
                    <label class="p-2 text-slate-400 hover:text-white transition-colors cursor-pointer" title="Импорт JSON">
                        <i class="fa-solid fa-file-import"></i>
                        <input type="file" id="import-file" class="hidden" accept=".json">
                    </label>
                </div>
            </div>

            <!-- Grid -->
            <div id="commands-grid" class="flex-1 overflow-y-auto p-4 sm:p-6 grid grid-cols-1 lg:grid-cols-2 xl:grid-cols-3 gap-4 sm:gap-6 content-start auto-rows-min">
            </div>
        </main>
    </div>

    <!-- Modal -->
    <div id="modal" class="fixed inset-0 z-50 hidden">
        <div class="absolute inset-0 bg-black/70 backdrop-blur-sm transition-opacity" id="modal-overlay"></div>
        <div class="
            fixed inset-0 sm:absolute sm:top-1/2 sm:left-1/2 
            sm:transform sm:-translate-x-1/2 sm:-translate-y-1/2 
            w-full sm:max-w-2xl
            bg-slate-800 border-slate-700 sm:border 
            rounded-none sm:rounded-xl 
            shadow-2xl flex flex-col 
            h-screen sm:h-[90vh]
        ">
            
            <div class="p-4 sm:p-6 border-b border-slate-700 flex justify-between items-center shrink-0">
                <h2 class="text-lg sm:text-xl font-bold text-white" id="modal-title">Новая команда</h2>
                <button id="modal-close" class="text-slate-400 hover:text-white">
                    <i class="fa-solid fa-times"></i>
                </button>
            </div>

            <div class="p-4 sm:p-6 overflow-y-auto flex-1 min-h-0 flex flex-col gap-4">
                <input type="hidden" id="cmd-id">
                
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 shrink-0">
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">Название</label>
                        <input type="text" id="cmd-title" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2.5 focus:border-blue-500 focus:outline-none text-white text-base" placeholder="Например: Show Interface Status">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">Вендор</label>
                        <input type="text" id="cmd-vendor" list="vendor-list" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2.5 focus:border-blue-500 focus:outline-none text-white text-base" placeholder="Cisco, Juniper...">
                        <datalist id="vendor-list">
                            <!-- Популярные вендоры для подсказки -->
                            <option value="Cisco">
                            <option value="Juniper">
                            <option value="Huawei">
                            <option value="Nokia">
                            <option value="Arista">
                            <option value="MikroTik">
                            <option value="Ubiquiti">
                            <option value="Ericsson">
                            <option value="IRTEYA">
                            <option value="BaiCells">
                        </datalist>
                    </div>
                </div>

                <div class="flex-1 min-h-0 flex flex-col min-h-[400px]">
                    <label class="block text-xs font-medium text-slate-400 mb-1">Команда / Шаблон</label>
                    <div class="relative flex-1 min-h-0">
                        <textarea id="cmd-template" rows="10" class="w-full h-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2.5 focus:border-blue-500 focus:outline-none text-green-400 font-mono text-sm resize-none" placeholder="show ip interface brief"></textarea>
                    </div>
                </div>

                <div class="flex-1 min-h-0 flex flex-col min-h-[150px] shrink-0">
                    <label class="block text-xs font-medium text-slate-400 mb-1">Описание / Примечания</label>
                    <textarea id="cmd-desc" rows="4" class="w-full h-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2.5 focus:border-blue-500 focus:outline-none text-slate-300 text-sm resize-none" placeholder="Краткое описание что делает команда..."></textarea>
                </div>

                <div class="shrink-0">
                    <label class="block text-xs font-medium text-slate-400 mb-1">Теги (через запятую)</label>
                    <input type="text" id="cmd-tags" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2.5 focus:border-blue-500 focus:outline-none text-white text-base" placeholder="diagnostics, layer2, troubleshooting">
                </div>
            </div>

            <div class="p-4 sm:p-6 border-t border-slate-700 flex justify-end gap-3 bg-slate-800/50 sm:rounded-b-xl shrink-0">
                <button id="modal-cancel" class="px-4 py-2 rounded-lg text-slate-300 hover:bg-slate-700 transition-colors">Отмена</button>
                <button id="modal-save" class="px-4 py-2 rounded-lg bg-blue-600 hover:bg-blue-500 text-white font-medium shadow-lg shadow-blue-600/20 transition-all transform active:scale-95">Сохранить</button>
            </div>
        </div>
    </div>

    <!-- View Modal -->
    <div id="view-modal" class="fixed inset-0 z-50 hidden">
        <div class="absolute inset-0 bg-black/70 backdrop-blur-sm transition-opacity" id="view-modal-overlay"></div>
        <div class="
            fixed inset-0 sm:absolute sm:top-1/2 sm:left-1/2 
            sm:transform sm:-translate-x-1/2 sm:-translate-y-1/2 
            w-full sm:max-w-4xl lg:max-w-5xl
            bg-slate-800 border-slate-700 sm:border 
            rounded-none sm:rounded-xl 
            shadow-2xl flex flex-col 
            h-screen sm:h-auto sm:max-h-[90vh]
        ">
            
            <div class="p-4 sm:p-6 border-b border-slate-700 flex justify-between items-center shrink-0">
                <h2 class="text-lg sm:text-xl font-bold text-white" id="view-modal-title">Просмотр команды</h2>
                <button id="view-modal-close" class="text-slate-400 hover:text-white">
                    <i class="fa-solid fa-times"></i>
                </button>
            </div>

            <div class="p-4 sm:p-6 overflow-y-auto flex-1 min-h-0 flex flex-col gap-4">
                <div class="space-y-4">
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-medium text-slate-500 uppercase tracking-wider mb-1">Название</label>
                            <p id="view-title" class="text-white text-base font-semibold"></p>
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-slate-500 uppercase tracking-wider mb-1">Вендор</label>
                            <p id="view-vendor" class="text-slate-300 text-base"></p>
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs font-medium text-slate-500 uppercase tracking-wider mb-1">Команда / Шаблон</label>
                        <div class="relative bg-slate-950 border border-slate-700 rounded-lg p-4">
                            <button id="view-copy-btn" class="absolute top-2 right-2 px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-300 hover:text-white rounded text-xs transition-colors flex items-center gap-1.5">
                                <i class="fa-regular fa-copy"></i>
                                <span>Копировать</span>
                            </button>
                            <pre id="view-template" class="font-mono text-green-400 text-sm whitespace-pre-wrap break-all pr-20"></pre>
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs font-medium text-slate-500 uppercase tracking-wider mb-1">Описание / Примечания</label>
                        <p id="view-description" class="text-slate-300 text-sm leading-relaxed whitespace-pre-wrap"></p>
                    </div>

                    <div>
                        <label class="block text-xs font-medium text-slate-500 uppercase tracking-wider mb-2">Теги</label>
                        <div id="view-tags" class="flex flex-wrap gap-2"></div>
                    </div>
                </div>
            </div>

            <div class="p-4 sm:p-6 border-t border-slate-700 flex justify-end gap-3 bg-slate-800/50 sm:rounded-b-xl shrink-0">
                <button id="view-modal-edit" class="px-4 py-2 rounded-lg bg-blue-600 hover:bg-blue-500 text-white font-medium shadow-lg shadow-blue-600/20 transition-all transform active:scale-95">
                    <i class="fa-solid fa-pen mr-2"></i>Редактировать
                </button>
            </div>
        </div>
    </div>

    <!-- Toast Container -->
    <div id="toast-container"></div>

    <!-- Scripts -->
    <script src="js/utils.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/modal.js"></script>
    <script src="js/view-modal.js"></script>
    <script src="js/autobackup.js"></script>
    <script src="js/history.js"></script>
    <script src="js/logger.js"></script>
    <script src="js/app.js"></script>

    <!-- Мобильное меню -->
    <script>
    function toggleMobileMenu() {
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('mobile-overlay');
        
        sidebar.classList.toggle('-translate-x-full');
        overlay.classList.toggle('hidden');
        
        // Блокируем скролл body когда меню открыто
        document.body.style.overflow = sidebar.classList.contains('-translate-x-full') ? '' : 'hidden';
    }

    document.getElementById('btn-menu').addEventListener('click', toggleMobileMenu);
    </script>

    <!-- Регистрация Service Worker -->
    <script>
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('sw.js')
                .then((reg) => console.log('[NetForge] SW зарегистрирован:', reg.scope))
                .catch((err) => console.error('[NetForge] Ошибка регистрации SW:', err));
        });
    }
    </script>
</body>
</html>
