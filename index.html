<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NetForge | Менеджер Сетевых Команд</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="manifest" href="manifest.json">
    <meta name="description" content="Локальная база знаний CLI-команд для сетевых инженеров">
    <meta name="theme-color" content="#2563eb">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">


</head>
<body class="h-screen flex flex-col overflow-hidden">

    <!-- Header -->
    <header class="h-16 glass flex items-center justify-between px-6 z-20 border-b border-slate-700 shrink-0">
        <div class="flex items-center gap-3">
            <div class="w-8 h-8 bg-blue-600 rounded-lg flex items-center justify-center shadow-lg shadow-blue-500/30">
                <i class="fa-solid fa-network-wired text-white text-sm"></i>
            </div>
            <h1 class="text-xl font-bold tracking-tight">Net<span class="text-blue-500">Forge</span></h1>
        </div>
        
        <div class="flex items-center gap-4">
            <div class="relative">
                <i class="fa-solid fa-search absolute left-3 top-1/2 transform -translate-y-1/2 text-slate-400 text-sm"></i>
                <input type="text" id="global-search" placeholder="Поиск команд..." 
                    class="bg-slate-800 border border-slate-700 text-sm rounded-full pl-9 pr-4 py-1.5 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 w-64 transition-all">
            </div>
            <button id="btn-new-cmd" class="bg-blue-600 hover:bg-blue-500 text-white px-4 py-1.5 rounded-full text-sm font-medium transition-colors flex items-center gap-2 shadow-lg shadow-blue-600/20">
                <i class="fa-solid fa-plus"></i> Новая команда
            </button>
            <button id="btn-install-pwa" class="hidden bg-emerald-600 hover:bg-emerald-500 text-white px-3 py-1.5 rounded-full text-sm font-medium transition-colors flex items-center gap-2">
                <i class="fa-solid fa-download"></i> Установить
            </button>
        </div>
    </header>

    <!-- Main Layout -->
    <div class="flex flex-1 min-h-0">
        
        <!-- Sidebar -->
        <aside class="w-64 bg-slate-900 border-r border-slate-800 flex flex-col hidden md:flex overflow-y-auto shrink-0">
            <div class="p-4 shrink-0">
                <h3 class="text-xs font-bold text-slate-500 uppercase tracking-wider mb-4">Вендоры</h3>
                <div id="vendor-filters" class="space-y-1"></div>
            </div>
            
            <div class="p-4 border-t border-slate-800 shrink-0">
                <h3 class="text-xs font-bold text-slate-500 uppercase tracking-wider mb-4">Теги</h3>
                <div id="tag-cloud" class="flex flex-wrap gap-2"></div>
            </div>

            <!-- AutoBackup Section -->
            <div class="p-4 border-t border-slate-800 shrink-0">
                <h3 class="text-xs font-bold text-slate-500 uppercase tracking-wider mb-3">Автобэкап</h3>
                <div class="bg-slate-800/50 rounded-lg p-3 space-y-2">
                    <div class="flex items-center justify-between">
                        <span class="text-xs text-slate-400">Статус</span>
                        <div class="flex items-center gap-2">
                            <div id="backup-status-indicator" class="w-2 h-2 rounded-full bg-green-500"></div>
                            <span id="backup-status-text" class="text-xs text-slate-300">Активен</span>
                        </div>
                    </div>
                    <div class="flex items-center justify-between">
                        <span class="text-xs text-slate-400">Сохранение</span>
                        <span id="backup-destination-text" class="text-xs text-blue-400">В загрузки</span>
                    </div>
                    <div class="flex items-center justify-between">
                        <span class="text-xs text-slate-400">Последний</span>
                        <span id="backup-last-date" class="text-xs text-slate-300">-</span>
                    </div>
                    <div class="pt-2 border-t border-slate-700/50 flex gap-2">
                        <button id="btn-backup-now" class="flex-1 px-2 py-1.5 bg-blue-600/20 hover:bg-blue-600/30 text-blue-400 rounded text-xs transition-colors">
                            <i class="fa-solid fa-download mr-1"></i> Сейчас
                        </button>
                        <button id="btn-backup-toggle" class="px-2 py-1.5 bg-slate-700/50 hover:bg-slate-700 text-slate-400 rounded text-xs transition-colors" title="Вкл/Выкл">
                            <i class="fa-solid fa-power-off"></i>
                        </button>
                    </div>
                </div>
            </div>
            <!-- LOGGER -->
            <div class="p-4 border-t border-slate-800 shrink-0">
                <h3 class="text-xs font-bold text-slate-500 uppercase tracking-wider mb-3">Логи</h3>
                   <div class="bg-slate-800/50 rounded-lg p-3 space-y-2">
                    <div class="flex items-center justify-between">
                        <span class="text-xs text-slate-400">Запись в папку</span>
                        <span id="log-status-text" class="text-xs text-slate-400">Выключена</span>
                    </div>
                        <button id="btn-toggle-logs" class="w-full px-2 py-1.5 bg-blue-600/20 hover:bg-blue-600/30 text-blue-400 rounded text-xs transition-colors">
                           <i class="fa-solid fa-folder mr-1"></i> Включить
                     </button>
                </div>
            </div>

            <div class="mt-auto p-4 border-t border-slate-800 shrink-0">
                <div class="bg-slate-800/50 rounded-lg p-3">
                    <div class="flex items-center gap-2 mb-2">
                        <div class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></div>
                        <span class="text-xs text-slate-300">Локальное хранилище</span>
                    </div>
                    <div class="text-xs text-slate-500">База: <span id="db-count">0</span> записей</div>
                    <button id="btn-clear-all" class="mt-2 text-xs text-red-400 hover:text-red-300 underline">Очистить всё</button>
                </div>
            </div>
        </aside>

        <!-- Content Area -->
        <main class="flex-1 flex flex-col min-h-0 bg-slate-900/50">
            <!-- Toolbar -->
            <div class="h-12 border-b border-slate-800 flex items-center justify-between px-6 bg-slate-900/80 backdrop-blur shrink-0">
                <div class="flex items-center gap-2 text-sm text-slate-400">
                    <span id="result-count">0</span> команд найдено
                </div>
                <div class="flex items-center gap-2">
                    <button id="btn-export" class="p-2 text-slate-400 hover:text-white transition-colors" title="Экспорт JSON">
                        <i class="fa-solid fa-file-export"></i>
                    </button>
                    <label class="p-2 text-slate-400 hover:text-white transition-colors cursor-pointer" title="Импорт JSON">
                        <i class="fa-solid fa-file-import"></i>
                        <input type="file" id="import-file" class="hidden" accept=".json">
                    </label>
                </div>
            </div>

            <!-- Grid -->
            <div id="commands-grid" class="flex-1 overflow-y-auto p-6 grid grid-cols-1 lg:grid-cols-2 xl:grid-cols-3 gap-6 content-start auto-rows-min">
            </div>
        </main>
    </div>

    <!-- Modal -->
    <div id="modal" class="fixed inset-0 z-50 hidden">
        <div class="absolute inset-0 bg-black/70 backdrop-blur-sm transition-opacity" id="modal-overlay"></div>
        <div class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 w-full max-w-2xl bg-slate-800 border border-slate-700 rounded-xl shadow-2xl flex flex-col max-h-[90vh]">
            
            <div class="p-6 border-b border-slate-700 flex justify-between items-center shrink-0">
                <h2 class="text-xl font-bold text-white" id="modal-title">Новая команда</h2>
                <button id="modal-close" class="text-slate-400 hover:text-white">
                    <i class="fa-solid fa-times"></i>
                </button>
            </div>

            <div class="p-6 overflow-y-auto space-y-4">
                <input type="hidden" id="cmd-id">
                
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">Название</label>
                        <input type="text" id="cmd-title" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 focus:border-blue-500 focus:outline-none text-white" placeholder="Например: Show Interface Status">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">Вендор</label>
                        <input type="text" id="cmd-vendor" list="vendor-list" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 focus:border-blue-500 focus:outline-none text-white" placeholder="Cisco, Juniper...">
                        <datalist id="vendor-list">
                            <option value="Ericsson">
                            <option value="IRTEYA">
                            <option value="BaiCells"></option>
                        </datalist>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Команда / Шаблон</label>
                    <div class="relative">
                        <textarea id="cmd-template" rows="4" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 focus:border-blue-500 focus:outline-none text-green-400 font-mono text-sm" placeholder="show ip interface brief"></textarea>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Описание / Примечания</label>
                    <textarea id="cmd-desc" rows="2" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 focus:border-blue-500 focus:outline-none text-slate-300 text-sm" placeholder="Краткое описание что делает команда..."></textarea>
                </div>

                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Теги (через запятую)</label>
                    <input type="text" id="cmd-tags" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 focus:border-blue-500 focus:outline-none text-white text-sm" placeholder="diagnostics, layer2, troubleshooting">
                </div>
            </div>

            <div class="p-6 border-t border-slate-700 flex justify-end gap-3 bg-slate-800/50 rounded-b-xl shrink-0">
                <button id="modal-cancel" class="px-4 py-2 rounded-lg text-slate-300 hover:bg-slate-700 transition-colors">Отмена</button>
                <button id="modal-save" class="px-4 py-2 rounded-lg bg-blue-600 hover:bg-blue-500 text-white font-medium shadow-lg shadow-blue-600/20 transition-all transform active:scale-95">Сохранить</button>
            </div>
        </div>
    </div>

    <!-- Toast Container -->
    <div id="toast-container"></div>

    <!-- Scripts -->
    <script src="js/utils.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/modal.js"></script>
    <script src="js/autobackup.js"></script>
    <script src="js/history.js"></script>
    <script src="js/logger.js"></script>
    <script src="js/app.js"></script>

    <!-- Регистрация Service Worker для PWA -->
    <script>
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('sw.js')
                .then((reg) => console.log('[NetForge] SW зарегистрирован:', reg.scope))
                .catch((err) => console.error('[NetForge] Ошибка регистрации SW:', err));
        });
    }
    </script>
</body>
</html>
